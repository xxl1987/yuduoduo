<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#7C83FD">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="语朵朵">
  <meta name="description" content="小学五年级语文基础、阅读与写作提升伙伴">
  <title>语朵朵 · 语文学习助手</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <!-- 侧边导航（桌面端） -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">语</div>
        <div class="brand-text">
          <strong>语朵朵</strong>
          <span>五年级语文成长伙伴</span>
        </div>
      </div>

      <nav class="side-nav" aria-label="主导航">
        <button class="nav-item active" data-page="home">
          <span class="nav-icon">🏠</span><span class="nav-label">今日计划</span>
        </button>
        <button class="nav-item" data-page="basic">
          <span class="nav-icon">📖</span><span class="nav-label">基础巩固</span>
        </button>
        <button class="nav-item" data-page="reading">
          <span class="nav-icon">🔍</span><span class="nav-label">阅读提升</span>
        </button>
        <button class="nav-item" data-page="writing">
          <span class="nav-icon">✍️</span><span class="nav-label">写作工坊</span>
        </button>
        <button class="nav-item" data-page="growth">
          <span class="nav-icon">🌱</span><span class="nav-label">成长记录</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="motto-card">
          <span class="motto-icon">✨</span>
          <p>每天进步一点点，<br>遇见更好的自己。</p>
        </div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 id="page-title">今日计划</h1>
          <p id="page-subtitle">今天也要加油哦，小朋友！</p>
        </div>
        <div class="topbar-right">
          <div class="stat-chip streak-chip" title="连续学习天数">
            <span class="chip-icon">🔥</span>
            <span class="chip-value" id="stat-streak">0</span>
            <span class="chip-label">天</span>
          </div>
          <div class="stat-chip star-chip" title="累计星星">
            <span class="chip-icon">⭐</span>
            <span class="chip-value" id="stat-stars">0</span>
            <span class="chip-label">星</span>
          </div>
          <div class="avatar" title="小朋友">👧</div>
        </div>
      </header>

      <div class="page-container" id="page-container">
        <!-- 页面内容由 app.js 渲染 -->
      </div>
    </main>

    <!-- 底部导航（移动端） -->
    <nav class="mobile-tabbar" aria-label="移动端导航">
      <button class="tab-item active" data-page="home"><span>🏠</span><small>计划</small></button>
      <button class="tab-item" data-page="basic"><span>📖</span><small>基础</small></button>
      <button class="tab-item" data-page="reading"><span>🔍</span><small>阅读</small></button>
      <button class="tab-item" data-page="writing"><span>✍️</span><small>写作</small></button>
      <button class="tab-item" data-page="growth"><span>🌱</span><small>成长</small></button>
    </nav>
  </div>

  <!-- 通用弹窗 -->
  <div class="modal-mask" id="modal-mask" hidden>
    <div class="modal-box" id="modal-box" role="dialog" aria-modal="true"></div>
  </div>

  <!-- 轻提示 -->
  <div class="toast" id="toast" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
